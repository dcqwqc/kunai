name: Android Native

on:
  push:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kunai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run native unit tests
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: kunai-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
