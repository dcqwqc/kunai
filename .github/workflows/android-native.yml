name: Android Native

on:
  push:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kunai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Hosted Ubuntu runners already include Android SDK command-line tools.
      # setup-android@v3 currently invokes the removed `sdkmanager tools` package
      # and fails before Gradle starts; use the installed sdkmanager directly.
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is required on the runner}"
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
          fi
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --licenses < <(yes) > /dev/null
          "$sdkmanager_bin" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run native unit tests
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: kunai-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
